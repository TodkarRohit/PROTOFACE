<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamCraft AI - Smart Assessment & Exam Paper Generator</title>
  <meta name="description" content="AI-powered Exam Paper Generator for educators. Split-screen controls, drag-and-drop syllabus upload, difficulty sliders, and live physical A4 document preview." />
  
  <!-- OpenGraph / Social Share Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ExamCraft AI - Smart Assessment & Exam Paper Generator" />
  <meta property="og:description" content="Build modern, clean, and customized exam papers with live A4 document preview and teacher answer keys." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ExamCraft AI - Smart Exam Paper Generator" />
  <meta name="twitter:description" content="Interactive AI Exam Paper Generator for teachers with live A4 document rendering." />
  
  <!-- Google Fonts: Inter, Outfit, Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,300&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              750: '#1e293b',
              850: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- React 18 & ReactDOM 18 UMD Scripts (Fast jsDelivr CDN with unpkg fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';"></script>
  
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Babel Standalone (Fast jsDelivr CDN with unpkg fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@babel/standalone/babel.min.js';"></script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen">

  <!-- App Mount Root -->
  <div id="root"></div>

  <!-- Entry Script -->
  <script type="text/babel" data-presets="react" src="./app.js"></script>

</body>
</html>
